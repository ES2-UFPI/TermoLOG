[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1",
    "fastapi[standard]>=0.143.1",
    "psycopg[binary]>=3.2",
    "reportlab[accel]>=4.4",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pypdf>=6",
    "pytest>=9.1.1",
]

[tool.ruff]
# Os módulos (database, salas, sensores...) ficam na raiz desta pasta.
src = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint.isort]
known-first-party = ["main"]
