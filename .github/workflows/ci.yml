name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se o backend existe
        id: detect
        run: |
          if [ -d backend ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pasta backend/ ainda não existe; job ignorado."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          for f in requirements.txt requirements-dev.txt; do
            if [ -f "$f" ]; then pip install -r "$f"; fi
          done
          pip install pytest

      - name: Testes
        if: steps.detect.outputs.exists == 'true'
        working-directory: backend
        run: python -m pytest

      - name: Build da imagem Docker
        if: steps.detect.outputs.exists == 'true' && hashFiles('backend/Dockerfile') != ''
        run: docker build -t termolog-backend:ci backend

  frontend:
    name: Frontend (build e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se o frontend existe
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json ainda não existe; job ignorado."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build --if-present

      - name: Testes
        if: steps.detect.outputs.exists == 'true'
        working-directory: frontend
        run: npm test --if-present
