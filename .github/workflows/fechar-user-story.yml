name: Fechar user story

on:
  issues:
    types: [closed]

permissions:
  issues: write

jobs:
  fechar-pai:
    runs-on: ubuntu-latest
    steps:
      - name: Fecha a issue pai quando todas as sub-issues estão fechadas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          owner="${REPO%/*}"; name="${REPO#*/}"
          n="$NUMERO"
          # Sobe a cadeia (sub-issue, user story, pai da user story...), porque um
          # fechamento feito com o GITHUB_TOKEN não dispara este workflow de novo.
          while :; do
            pai=$(gh api graphql -f query='
              query($o:String!,$r:String!,$n:Int!){
                repository(owner:$o,name:$r){
                  issue(number:$n){
                    parent{ number state subIssuesSummary{ total completed } }
                  }
                }
              }' -f o="$owner" -f r="$name" -F n="$n" --jq '.data.repository.issue.parent')

            if [ -z "$pai" ] || [ "$pai" = "null" ]; then
              break
            fi

            num=$(jq -r .number <<<"$pai")
            estado=$(jq -r .state <<<"$pai")
            total=$(jq -r .subIssuesSummary.total <<<"$pai")
            feitas=$(jq -r .subIssuesSummary.completed <<<"$pai")

            if [ "$estado" != "OPEN" ] || [ "$total" -eq 0 ] || [ "$total" != "$feitas" ]; then
              break
            fi

            gh issue close "$num" -R "$REPO" --reason completed \
              --comment "Fechada automaticamente: as $total sub-issues foram concluídas."
            n="$num"
          done
