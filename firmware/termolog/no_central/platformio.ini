; Compila o mesmo sketch do arduino-cli: o código-fonte é o .ino desta pasta.
; Versões iguais às do sketch.yaml (core Arduino 3.3.12).

[platformio]
src_dir = .
; Sem isto, "pio run -t upload" gravaria os dois ambientes, um depois do outro.
default_envs = esp32

[env:esp32]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
; Sem OTA: app de 3 MB (o Wi-Fi com TLS não cabe folgado em 1,25 MB) e 896 KB para a fila.
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<.pio/>
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa@0.8.0
    bblanchon/ArduinoJson@7.4.2

; SÓ PARA DEMONSTRAÇÃO: ciclo de 2 s, contato com a API em todo ciclo e comandos entregues na
; hora ao nó de borda, que tem que estar no ambiente sensor_1_demonstracao. Na sala, use o esp32.
; Gravar: pio run -e demonstracao -t upload
[env:demonstracao]
extends = env:esp32
build_flags = -D MODO_DEMONSTRACAO=1 -D CICLO_ENVIO_S=2
