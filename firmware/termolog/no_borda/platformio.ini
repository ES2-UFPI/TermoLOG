; Compila o mesmo sketch do arduino-cli: o código-fonte é o .ino desta pasta.
; Versões iguais às do sketch.yaml (core Arduino 3.3.12).

[platformio]
src_dir = .
default_envs = sensor_1

; Configuração comum a todas as placas de borda.
[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
build_src_filter = +<*> -<.pio/>
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    sandeepmistry/LoRa@0.8.0
    crankyoldgit/IRremoteESP8266@2.9.0

; Um ambiente por placa, com o ID que o backend gerou para o sensor dela
; (POST /salas/{id}/sensores). Para uma placa nova, copie o bloco e troque o ID.
; Gravar: pio run -e sensor_1 -t upload
; O sensor_1 é o emissor da sala de testes: ar Electrolux (controle YAW1F), protocolo GREE com o
; modelo 1, ventilador na velocidade baixa, como no controle original, e luz do painel ligada
; em todo comando (sem ela, cada comando apagava o display) (#222).
[env:sensor_1]
; build_flags = -D SENSOR_ID=1 -D AC_PROTOCOLO=GREE -D AC_MODELO=1 -D AC_VENTILADOR=kLow -D AC_LUZ=1
; Ar Carrier (controle RG10B(B2)/BGEF), também testado: protocolo COOLIX, ventilador automático.
; Sem AC_LUZ: no COOLIX a luz é um comando que alterna o display, e ele piscaria a cada envio.
build_flags = -D SENSOR_ID=1 -D AC_PROTOCOLO=COOLIX

; SÓ PARA DEMONSTRAÇÃO: o mesmo sensor_1, sem deep sleep e com o rádio sempre ouvindo, para o
; comando do painel chegar em segundos. Gasta a bateria em horas. Gravar com o nó central no
; ambiente demonstracao: pio run -e sensor_1_demonstracao -t upload
[env:sensor_1_demonstracao]
build_flags = ${env:sensor_1.build_flags} -D MODO_DEMONSTRACAO=1
