; Compila o mesmo sketch do arduino-cli: o código-fonte é o .ino desta pasta.
; Versões iguais às do sketch.yaml (core Arduino 3.3.12).

[platformio]
src_dir = .
default_envs = sensor_1

; Configuração comum a todas as placas de borda.
[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
build_src_filter = +<*> -<.pio/>
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@1.4.7
    adafruit/Adafruit Unified Sensor@1.1.15
    sandeepmistry/LoRa@0.8.0

; Um ambiente por placa, com o ID que o backend gerou para o sensor dela
; (POST /salas/{id}/sensores). Para uma placa nova, copie o bloco e troque o ID.
; Gravar: pio run -e sensor_1 -t upload
[env:sensor_1]
build_flags = -D SENSOR_ID=1
